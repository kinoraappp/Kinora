<!DOCTYPE html> <html lang="uz"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>KINORA</title> <style> * { box-sizing: border-box; } body { margin: 0; background: #080b14; color: white; font-family: Arial, sans-serif; } header { background: #101827; padding: 20px; text-align: center; border-bottom: 2px solid #168cff; } .logo { color: #168cff; font-size: 30px; font-weight: bold; letter-spacing: 3px; } header p { color: #aaa; margin-bottom: 0; } .search { padding: 15px; } input { width: 100%; padding: 14px; border: 1px solid #168cff; border-radius: 10px; background: #121b2b; color: white; font-size: 16px; outline: none; } h2 { margin: 10px 15px; } .categories { display: flex; gap: 10px; overflow-x: auto; padding: 15px; } .categories button { background: #14243a; color: white; border: 1px solid #168cff; padding: 10px 15px; border-radius: 20px; white-space: nowrap; } .categories button:focus { background: #168cff; } .movies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 15px; } .card { background: #111827; border-radius: 12px; overflow: hidden; border: 1px solid #1d2d43; } .poster { height: 155px; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #102b4e, #168cff); font-size: 48px; } .info { padding: 12px; } .info h3 { font-size: 16px; margin: 0 0 8px; } .info p { color: #aaa; font-size: 12px; } .info button { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 7px; background: #168cff; color: white; font-weight: bold; } .favorite { background: #25354b !important; } footer { text-align: center; color: #777; padding: 25px; } #player { display: none; padding: 15px; } video { width: 100%; border-radius: 10px; background: black; } </style> </head> <body> <header> <div class="logo">KINORA</div> <p>Kinolar olamiga xush kelibsiz</p> </header> <div class="search"> <input id="search" type="text" placeholder="Kino nomini qidiring..." oninput="renderMovies()"> </div> <h2>Janrlar</h2> <div class="categories"> <button onclick="setGenre('Barchasi')">Barchasi</button> <button onclick="setGenre('Jangari')">Jangari</button> <button onclick="setGenre('Fantastika')">Fantastika</button> <button onclick="setGenre('Komediya')">Komediya</button> <button onclick="setGenre('Drama')">Drama</button> </div> <h2>🎬 Kinolar</h2> <div class="movies" id="movies"></div> <div id="player"> <h2 id="movieTitle">Kino</h2> <video id="video" controls playsinline></video> <button onclick="closePlayer()" style="padding:12px;background:#168cff;color:white;border:0;border-radius:8px;"> Orqaga </button> </div> <h2>❤️ Sevimlilar</h2> <div class="movies" id="favorites"></div> <footer> KINORA © 2026<br> Barcha kinolar bir joyda </footer> <script> const movies = [ { id: 1, title: "Moviy ufq", genre: "Drama", icon: "🌊", year: 2025, url: "" }, { id: 2, title: "Boshqa olam", genre: "Fantastika", icon: "🚀", year: 2025, url: "" }, { id: 3, title: "Jasorat", genre: "Jangari", icon: "⚔️", year: 2024, url: "" }, { id: 4, title: "Kulgi kechasi", genre: "Komediya", icon: "😂", year: 2025, url: "" } ]; let selectedGenre = "Barchasi"; let favorites = JSON.parse( localStorage.getItem("kinora_favorites")  "[]" ); function setGenre(genre) { selectedGenre = genre; renderMovies(); } function renderMovies() { const query = document .getElementById("search") .value.toLowerCase(); const filtered = movies.filter(movie => { const matchesName = movie.title.toLowerCase().includes(query); const matchesGenre = selectedGenre === "Barchasi"  movie.genre === selectedGenre; return matchesName && matchesGenre; }); document.getElementById("movies").innerHTML = filtered.map(movie => movieCard(movie)).join(""); const favoriteMovies = movies.filter(movie => favorites.includes(movie.id) ); document.getElementById("favorites").innerHTML = favoriteMovies.map(movie => movieCard(movie)).join(""); } function movieCard(movie) { const isFavorite = favorites.includes(movie.id); return ` <div class="card"> <div class="poster">${movie.icon}</div> <divclass="info"> <h3>${movie.title}</h3> <p>${movie.genre} • ${movie.year}</p> <button onclick="playMovie(${movie.id})"> ▶ Ko'rish </button> <button class="favorite" onclick="toggleFavorite(${movie.id})"> ${isFavorite ? "❤️ Saqlangan" : "♡ Sevimlilarga"} </button> </div> </div> `; } function toggleFavorite(id) { if (favorites.includes(id)) { favorites = favorites.filter(item => item !== id); } else { favorites.push(id); } localStorage.setItem( "kinora_favorites", JSON.stringify(favorites) ); renderMovies(); } function playMovie(id) { const movie = movies.find(item => item.id === id); document.getElementById("player").style.display = "block"; document.getElementById("movieTitle").textContent = movie.title; const video = document.getElementById("video"); video.pause(); if (movie.url) { video.src = movie.url; } else { video.removeAttribute("src"); video.load(); alert("Bu kino uchun hali video manbasi ulanmagan."); } document.getElementById("player").scrollIntoView({ behavior: "smooth" }); } function closePlayer() { const video = document.getElementById("video"); video.pause(); document.getElementById("player").style.display = "none"; } renderMovies(); </script> </body> </html>
